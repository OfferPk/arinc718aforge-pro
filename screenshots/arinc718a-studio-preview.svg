<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Top Navigation Bar -->
  <rect x="20" y="15" width="960" height="50" rx="6" fill="#0f141e" stroke="#1e293b"/>
  <text x="40" y="46" fill="#06b6d4" font-size="18" font-weight="700">ARINC718AForge Pro (v1.0.0) — Glass-Cockpit Transponder Station</text>
  <rect x="780" y="26" width="180" height="28" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="795" y="45" fill="#10b981" font-size="11" font-weight="700">TSO-C112e / ED-73E PASS</text>

  <!-- Cockpit Bezel Left Panel -->
  <rect x="20" y="80" width="340" height="500" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <rect x="40" y="105" width="300" height="140" rx="6" fill="#18202c" stroke="#334155"/>
  <rect x="55" y="125" width="270" height="70" rx="4" fill="#020617" stroke="#0f172a"/>
  <text x="110" y="172" fill="#34d399" font-family="'SF Mono', monospace" font-size="42" font-weight="900" letter-spacing="8">4521</text>
  <text x="145" y="190" fill="#94a3b8" font-size="10" letter-spacing="1">MODE 3/A SQUAWK</text>

  <!-- Mode & Switch Knobs -->
  <rect x="40" y="265" width="140" height="40" rx="4" fill="#1e293b" stroke="#06b6d4"/>
  <text x="60" y="290" fill="#f8fafc" font-size="12" font-weight="700">XPDR 1 (CAPT)</text>

  <rect x="200" y="265" width="140" height="40" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="220" y="290" fill="#94a3b8" font-size="12" font-weight="700">XPDR 2 (F/O)</text>

  <rect x="40" y="325" width="300" height="40" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="55" y="350" fill="#06b6d4" font-size="12" font-weight="700">MODE: ALT ON (MODE C/S)</text>

  <!-- Emergency Buttons -->
  <rect x="40" y="385" width="90" height="35" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444"/>
  <text x="55" y="407" fill="#fca5a5" font-size="11" font-weight="700">7500 HIJACK</text>

  <rect x="145" y="385" width="90" height="35" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444"/>
  <text x="155" y="407" fill="#fca5a5" font-size="11" font-weight="700">7600 LOST</text>

  <rect x="250" y="385" width="90" height="35" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444"/>
  <text x="260" y="407" fill="#fca5a5" font-size="11" font-weight="700">7700 MAYDAY</text>

  <rect x="40" y="435" width="140" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="457" fill="#f8fafc" font-size="11" font-weight="600">1200 US VFR</text>

  <rect x="200" y="435" width="140" height="35" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b"/>
  <text x="245" y="457" fill="#fbbf24" font-size="11" font-weight="700">IDENT</text>

  <!-- Right: BDS Registers & ARINC 429 Bus Table -->
  <rect x="380" y="80" width="600" height="235" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="400" y="110" fill="#06b6d4" font-size="13" font-weight="700">COMM-B DATA SELECTOR (BDS) REGISTERS</text>
  
  <rect x="400" y="125" width="560" height="30" fill="rgba(255,255,255,0.03)"/>
  <text x="410" y="145" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">BDS 1,0  0x1005C100000000  Level 4 Mark 4, Diversity Active</text>

  <rect x="400" y="160" width="560" height="30" fill="transparent"/>
  <text x="410" y="180" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">BDS 2,0  0x55414531323320  Flight ID: "UAE123  "</text>

  <rect x="400" y="195" width="560" height="30" fill="rgba(255,255,255,0.03)"/>
  <text x="410" y="215" fill="#fbbf24" font-size="11" font-family="'SF Mono', monospace">BDS 3,0  0x00000000000000  TCAS RA Broadcast: Inactive</text>

  <rect x="400" y="230" width="560" height="30" fill="transparent"/>
  <text x="410" y="250" fill="#34d399" font-size="11" font-family="'SF Mono', monospace">BDS 4,0  0x890B2000000000  Target Alt: 37,000 ft, Baro: 1013 hPa</text>

  <rect x="400" y="265" width="560" height="30" fill="rgba(255,255,255,0.03)"/>
  <text x="410" y="285" fill="#c084fc" font-size="11" font-family="'SF Mono', monospace">BDS 6,0  0x81F28400000000  Hdg: 124.5°, IAS: 460 kt, Mach: 0.82</text>

  <!-- Right Bottom: 10-Point Normative Auditor -->
  <rect x="380" y="335" width="600" height="245" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="400" y="365" fill="#10b981" font-size="13" font-weight="700">10-POINT NORMATIVE AUDITOR (10/10 PASSED - 100%)</text>

  <text x="400" y="395" fill="#cbd5e1" font-size="11">[PASSED] A718A_01: Dual-Redundant Transponder Architecture (XPDR 1 &amp; 2)</text>
  <text x="400" y="420" fill="#cbd5e1" font-size="11">[PASSED] A718A_02: ARINC 429 Bit 32 Odd Parity Rule on Control Words</text>
  <text x="400" y="445" fill="#cbd5e1" font-size="11">[PASSED] A718A_03: Mode S Comm-B BDS Register Matrix Completeness (BDS 1,0-6,0)</text>
  <text x="400" y="470" fill="#cbd5e1" font-size="11">[PASSED] A718A_04: ICAO 24-Bit Aircraft Address Sovereign Hex Validation</text>
  <text x="400" y="495" fill="#cbd5e1" font-size="11">[PASSED] A718A_05: Octal Squawk Code Range &amp; Label 016 BCD Serialization</text>
  <text x="400" y="520" fill="#cbd5e1" font-size="11">[PASSED] A718A_06: Emergency Squawk State Machine (7500 / 7600 / 7700)</text>
  <text x="400" y="545" fill="#cbd5e1" font-size="11">[PASSED] A718A_07: TCAS II Active Resolution Advisory (RA) Interlock</text>
</svg>